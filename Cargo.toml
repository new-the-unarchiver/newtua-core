[package]
name = "newtua-core"
version = "0.3.0"
edition = "2024"
rust-version = "1.93"
license = "LGPL-3.0-or-later"
description = "Archive extraction engine: lists and extracts over 50 formats entirely in-process, with no subprocess fallbacks. Extract only — never creates archives."
readme = "README.md"
repository = "https://github.com/new-the-unarchiver/newtua-core"
keywords = ["archive", "extract", "unarchiver", "zip", "rar"]
categories = ["compression", "filesystem"]
# Tests and their fixtures stay in the repository and run in CI, but they do
# not ship: the fixtures alone are 11 MB against a 10 MiB package limit, and
# the test files embed them with include_bytes!, so shipping the tests without
# their fixtures would hand consumers a suite that cannot compile.
exclude = ["tests/**"]

[dependencies]
ar = "0.9"
filetime = "0.2"
thiserror = "2"
encoding_rs = "0.8"
chardetng = "0.1"
flate2 = "1"
bzip2 = "0.5"
# Windows cabinets (.cab, and the payload inside .msi). The `cab` crate is NOT a
# dependency: its read half is vendored in src/vendor/cab/ — see the VENDORED.md
# there for why (one-pass folder reading exists upstream on `master`, in no
# release, and a git dependency cannot be published to crates.io). These two are
# what that vendored code needs, and nothing else in the engine uses them.
byteorder = "1"
lzxd = "0.2.5"
xz2 = "0.1"
# zip 7 adds the PPMd method (feature "ppmd", backed by `ppmd-rust`); zip 2.x
# didn't support it at all. `ppmd-rust` is already in the tree transitively via
# sevenz-rust2 0.21, licensed CC0-1.0 OR MIT-0 — no conflict with our
# LGPL-3.0-or-later. The bump to 7 built clean with no code changes elsewhere.
# `legacy-zip` (Shrink/Reduce/Implode — methods 1 and 2–6) is ON. Real PKZIP
# 1989/1990 archives using all three sit in the reference corpus, and until this
# was turned on they opened, listed their members and then refused every one of
# them: an archive that "opened but gives nothing". Shrink and Implode are
# confirmed against foreign readers (`unzip`, `7zz`) with matching CRCs; Reduce
# has no such second reader — `unzip`, `7zz` and `unar` all decline it — so its
# corpus cells are checked against the payload they were built from instead.
# There is no fixture here that would notice the feature being switched back
# off: the archives live in the reference corpus, not in this repo. Six of its
# cells drop from OK/LISTED to PARTIAL if it goes, which is what the pre-release
# run is for.
# One thing the changelog does not announce: between 2.4.2 and 7.2.0 the XZ
# decoder behind this crate changed twice (xz2 → liblzma → lzma_rust2, a pure
# Rust one). Method 14 (LZMA) we decode ourselves, but XZ we hand over whole,
# so the `xz_zipx_*` integration tests are the only thing standing between us
# and a silent divergence there.
zip = { version = "7", features = ["lzma", "bzip2", "zstd", "deflate64", "xz", "ppmd", "legacy-zip"] }
zstd = "0.13"
lz4_flex = "0.11"
brotli-decompressor = "5"
# Framed Snappy (`.sz`, what Keka calls SNAPPY): pure Rust, zero runtime
# dependencies, no `links` and no system library — its build.rs only emits
# CRC/tag lookup tables as Rust source into OUT_DIR, so the three targets build
# identically. BSD-3-Clause, compatible with our LGPL-3.0-or-later. Only the
# framing2 stream format is decoded (it has magic); raw Snappy has none and is
# deliberately not detected. See decompress.rs and detect_compressor.
snap = "1"
tar = "0.4"
time = "0.3"
# Только ради `mktime`: перевод «часы на стене» в момент времени с учётом
# часового пояса и перехода на летнее время в ту историческую дату. Форматы
# своей эпохи (MS-DOS в zip, классический Mac в StuffIt и родне) хранят именно
# местное время, без указания зоны, и прочитать его как всемирное значит
# показать человеку не ту дату, что видел автор файла. В стандартной библиотеке
# часовых поясов нет вовсе; `time` умеет, но на Unix отказывается работать в
# многопоточной программе, а нас подключают в приложения с интерфейсом.
# `mktime` есть в libc всех трёх наших целей, включая MSVC.
libc = "0.2"
# Нижняя граница 0.21.4, а не 0.21: там закрыто переполнение на счётчиках,
# которые крейт читает из заголовка архива, — то есть из данных, задаваемых тем,
# кто архив прислал. На 0.21.0..0.21.3 битый 7z паниковал в отладочной сборке и
# обходил проверку числа потоков в релизной. `Cargo.lock` у нас под gitignore
# (это библиотека), так что удержать версию может только эта строка: без неё
# потребитель со старым замком остаётся на уязвимой сборке.
sevenz-rust2 = { version = "0.21.4", features = ["aes256"] }
# RAR читается вендоренной читающей половиной `rars` (src/vendor/rars/), и
# зависимости под него здесь нет вовсе. Была: `unrar = { package =
# "newtua-unrar" }` — форк libunrar, полтора мегабайта чужого C++ с лицензией,
# несовместимой с нашей, и с биндингом, который держал под замком точное время
# RAR 5, поле ссылок и хеш BLAKE2sp. Ушёл вместе с тикетом 26; форсированных
# форков после этого три, а не четыре.
# Ниже — то, что нужно вендоренной читающей половине `rars` (src/vendor/rars/);
# ничто другое в движке этим не пользуется. Сам крейт `rars` в зависимостях НЕ
# стоит намеренно — см. VENDORED.md там же: мы взяли только читающую половину,
# вносим свои правки и не следим за чужими выпусками (а они раз в неделю).
#
# ВЕРСИИ ЗДЕСЬ ЗАДАЁТ ЧУЖОЙ КОД, а не мы: они списаны с `Cargo.toml` крейта
# `rars` 0.4.8. Обычный `cargo upgrade` до следующего мажора RustCrypto сломает
# вендоренные `crypto/*.rs`, и поломка будет выглядеть случайной. Поднимать —
# только вместе с правкой того кода.
#
# Плата, которую видно в `Cargo.lock`: `sha1`, `sha2` и `hmac` собираются по два
# раза — старая линия приходит транзитивно (`rpm`, `sevenz-rust2`, `zip`), новая
# нужна здесь. Это время сборки и ничего больше; уйдёт, когда те крейты поднимут
# свои. Переписывать вендоренный код под старую линию ради этого не стоит.
#
# `crc32fast` — CRC-32 через аппаратную инструкцию (~4,5 ГБ/с на Apple Silicon)
# вместо самодельного slice-by-8, который давал ~1,8 ГБ/с и съедал пятую часть
# времени распаковки RAR 5. В графе он был и раньше — его тянут `flate2` и
# `bzip2-rs`, — так что новой сборки не появилось, строка лишь делает
# зависимость прямой. Своими силами это недостижимо: интринсик требует
# `unsafe`, а на всём каталоге `src/vendor/` стоит `#[forbid(unsafe_code)]`
# (объявление `mod vendor` в src/lib.rs). Собственный `newtua-common::crc32`
# сюда не годится — он считает бит за битом.
crc32fast = "1.5"
# Шифрование RAR 5: AES-256 в CTR для тела и заголовков (`crypto/rar50.rs`).
# Фича `zeroize` затирает расписание ключей при уничтожении — пароль не
# остаётся в памяти после распаковки.
aes = { version = "0.9", features = ["zeroize"] }
# Вывод ключа из пароля: RAR 5 — PBKDF2-HMAC-SHA256 (`hmac` + `sha2`), RAR 3 —
# своя схема на SHA-1 (`crypto/rar30.rs`). Три крейта, две эпохи формата.
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
# Затирание ключей и паролей; `default-features = false` — крейт умеет в
# no_std, нам нужны только `alloc` и производный макрос.
zeroize = { version = "1.8", default-features = false, features = ["alloc", "zeroize_derive"] }
# Поиск сигнатуры архива за самораспаковывающейся заглушкой: несколько образцов
# (RAR 1.3/1.5/5) ищутся одним проходом (`detect.rs`, автомат за `OnceLock`).
# В графе уже был — приходит через `regex`.
aho-corasick = "1.1"
tempfile = "3"
# cpio (.cpio/.cpgz) has no crate behind it on purpose — all three ASCII
# variants (newc 070701, crc 070702, odc 070707) are parsed in format/cpio.rs.
# `cpio = "0.4"` used to read newc and was dropped: it runs every entry name
# through String::from_utf8, so one CP1251/Shift-JIS/Latin-1 name failed the
# whole open — precisely the case `decode_names` exists for — and it read no
# other variant. The alternatives share one shape or another of the same
# problem: names decoded eagerly as UTF-8, a front-to-back stream that cannot
# skip a body by seeking (so listing costs a full copy), or a build that needs
# Unix-only pieces we ship on Windows too.
rpm = { version = "0.25", default-features = false }
# XAR (.xar/.pkg): in-house decode-only reader (header + zlib TOC + heap). Uses
# the shared flate2/bzip2/xz2 plus a tiny XML DOM; no apple-xar, no `ring`.
roxmltree = "0.21"
# MSI (.msi): CFB database with embedded CAB stream(s). The handler resolves the
# File/Component/Directory tables to real install paths (model C) and reuses
# CabHandler for the embedded CAB bytes. Always built.
msi = "0.10"
# ISO 9660 (.iso): forced fork of `cdfs`. Its last release declares `fuser` as
# an ordinary dependency of the library, so building on Linux would demand the
# system libfuse3 package for a mounting feature we never use. Upstream already
# split the binary off; the fix is unreleased. Lib name stays `cdfs`.
cdfs = { package = "newtua-cdfs", version = "0.2.4-newtua.1" }
# Used by format/sfx.rs to find where the executable stub ends and the appended
# archive begins. `pe32`/`pe64` for Windows self-extractors, `mach32`/`mach64`
# for the macOS ones 7-Zip builds (`7zz a -sfx`, stub shipped by Homebrew). ELF
# is deliberately absent: AppImage has its own handler.
goblin = { version = "0.10", default-features = false, features = ["pe32", "pe64", "mach32", "mach64", "std", "endian_fd"] }
warc = "0.4"
# SquashFS (.squashfs/.sfs): pure-Rust reader. Explicit gzip/zstd/lz4/lzo +
# parallel; backhand's `xz` feature stays OFF (its liblzma collides with our
# xz2 on `links = "lzma"`) — xz is decoded via xz2, see format/squashfs.rs.
# Reopens the file by path because backhand's BufReadSeek requires Send.
backhand = { version = "0.25", features = ["lzo", "gzip", "zstd", "lz4", "parallel"], default-features = false }
lzw-z = { package = "newtua-lzw-z", version = "0.1" }
# ZIP method-14 (LZMA) decode — see format/zip.rs::decode_zip_lzma.
lzma-rs = "0.3"
# WIM (.wim/.esd) resource chunk decoding: XPRESS-Huffman. See format/wim.rs.
newtua-mscompress = "0.1"
# HFS+/HFSX (.hfs/.hfsplus/.hfsx, and the filesystem inside DMG images):
# vendored reader (decmpfs-capable), see the newtua-hfsplus fork's README
# and format/hfsplus.rs.
hfsplus-forensic = { package = "newtua-hfsplus", version = "0.3.0-newtua.1" }
# Memory-maps the volume for hfsplus-forensic's byte-buffer API. See
# format/hfsplus.rs::open_hfsplus.
memmap2 = "0.9"
# DMG/UDIF container (.dmg): LZFSE (ULFO) chunk decoding. See format/dmg.rs.
lzfse_rust = "0.2.1"
# APFS filesystem inside DMG images / bare containers (#21c): vendored reader,
# see the newtua-apfs fork's README and format/apfs.rs.
apfs-core = { package = "newtua-apfs", version = "0.2.0-newtua.2" }
# Already resolved transitively (via rpm); used directly to decode the plist
# `Data` base64 field. See format/dmg.rs.
base64 = "0.22"
# Legacy-format decoders ported from XADMaster (the newtua-formats family).
# Thin FormatHandler/ArchiveReader adapters live in src/format/legacy/. Each
# crate exposes a uniform recognize/open/entries/read_entry API over &[u8].
# 0.1.4 — не "0.1": ZooEntry::timezone появился именно в ней (после 0.1.3),
# и на 0.1.3 наш код не соберётся.
# Общие кирпичи семейства: битовый читатель MSB и скользящее окно LZSS, оба
# порты из XADMaster. Ими пользуется src/vendor/cab/quantum.rs — декодер
# Quantum портирован из того же XADMaster, так что окно здесь буквально то же
# самое `LZSS.c`, а не похожее. Своих копий этих двух примитивов не заводить.
newtua-common = "0.1.2"
newtua-dos = "0.1.4"
newtua-mac = "0.1"
newtua-stuffit = "0.1.2"
newtua-amiga = "0.1"
newtua-alz = "0.1.2"
newtua-nsis = "0.1"

[features]
default = []

[dev-dependencies]
tar = "0.4"
tempfile = "3"
# Kept in lockstep with the [dependencies] entry above (same version, same
# feature set) so the resolver only ever settles on one `zip` version for the
# whole build.
zip = { version = "7", features = ["lzma", "bzip2", "zstd", "deflate64", "xz", "ppmd", "legacy-zip"] }
# Here and only here: the CAB fixtures in tests/ are built by upstream `cab`'s
# writer, while the engine reads them with the vendored reader in
# src/vendor/cab/. That split is deliberate — a fixture built by the same code
# that reads it can only ever prove the code agrees with itself. Upstream's
# writer is an independent implementation, and `gcab -c -z` is the other oracle
# (see .claude/issues/18).
cab = "0.6"
flate2 = "1"
# Ровно та же версия, что стоит в [dependencies] — как у `zip` выше и по той же
# причине. Транзитивно две мажорные версии сосуществуют спокойно (в `Cargo.lock`
# сейчас и 0.10, и 0.11), а вот два **прямых** объявления одного крейта у одного
# пакета — из библиотеки и из тестовой цели — дают компилятору два кандидата с
# одним именем, и сборка тестов падает на `multiple candidates for rmeta`.
sha2 = "0.11"
